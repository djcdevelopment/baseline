<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Living fleet status workflow</title>
  <desc id="desc">Data-flow diagram for the Baseline fleet status system, followed by the GitHub Actions build, deploy, and audit jobs, their tasks, the twice-hourly timer, and the observation, direction-review, and repair feedback loops.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86a497"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f28f83"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .bg { fill: #0b1110; }
      .panel { fill: #111a17; stroke: #31453b; stroke-width: 2; }
      .node { stroke-width: 2; filter: url(#shadow); }
      .external { fill: #292319; stroke: #d7ba72; }
      .store { fill: #173126; stroke: #79d19b; }
      .process { fill: #17293a; stroke: #7db8f3; }
      .artifact { fill: #29203b; stroke: #c09af5; }
      .warning { fill: #38221e; stroke: #ef8e82; }
      .neutral { fill: #1a2420; stroke: #638071; }
      .trigger { fill: #202a26; stroke: #69887a; stroke-width: 1.5; }
      .job { fill: #16231e; stroke: #6aa882; stroke-width: 2; filter: url(#shadow); }
      .job-deploy { fill: #18283a; stroke: #7db8f3; }
      .job-audit { fill: #32231d; stroke: #e0a762; }
      .loop-card { fill: #151f1b; stroke: #466255; stroke-width: 2; }
      .line { fill: none; stroke: #86a497; stroke-width: 3; marker-end: url(#arrow); }
      .line-thin { fill: none; stroke: #718d80; stroke-width: 2; marker-end: url(#arrow); }
      .line-warn { fill: none; stroke: #f28f83; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow-warn); }
      .bus { fill: none; stroke: #668276; stroke-width: 2; }
      .title { fill: #eff8f2; font: 700 36px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .subtitle { fill: #a9bbb1; font: 18px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .section { fill: #8cdaa9; font: 700 23px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.3px; }
      .node-title { fill: #f2f8f4; font: 700 19px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .body { fill: #c8d5ce; font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .small { fill: #aabcb2; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .tiny { fill: #9caf9f; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .label { fill: #bed0c6; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { fill: #d7e7de; font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .chip { fill: #26342e; stroke: #607c6f; stroke-width: 1; }
      .chip-text { fill: #d8e6de; font: 700 12px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 0.2px; }
      .green { fill: #86d6a3; }
      .blue { fill: #8ac3fa; }
      .purple { fill: #c8a4f7; }
      .amber { fill: #efc878; }
      .red { fill: #f39a90; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1280"/>
  <text class="title" x="50" y="52">Living fleet status workflow</text>
  <text class="subtitle" x="50" y="82">Baseline-owned intent + live GitHub facts → honest public projection → actionable audit</text>

  <g aria-label="Legend" transform="translate(1260 28)">
    <rect class="external" x="0" y="0" width="20" height="20" rx="4"/>
    <text class="small" x="29" y="15">actor / external system</text>
    <rect class="store" x="195" y="0" width="20" height="20" rx="4"/>
    <text class="small" x="224" y="15">authority / data store</text>
    <rect class="process" x="390" y="0" width="20" height="20" rx="4"/>
    <text class="small" x="419" y="15">process / job</text>
    <rect class="warning" x="0" y="31" width="20" height="20" rx="4"/>
    <text class="small" x="29" y="46">degraded signal</text>
    <line x1="195" y1="41" x2="240" y2="41" class="line-thin"/>
    <text class="small" x="252" y="46">data or control flow</text>
  </g>

  <!-- Panel 1: DFD -->
  <rect class="panel" x="35" y="105" width="1730" height="525" rx="18"/>
  <text class="section" x="65" y="145">1 · Data-flow diagram</text>

  <!-- trigger bus, rendered behind nodes -->
  <path class="bus" d="M 175 235 V 266 H 960 V 296"/>
  <path class="bus" d="M 425 235 V 266"/>
  <path class="bus" d="M 675 235 V 266"/>
  <path class="line-thin" d="M 960 266 V 296"/>

  <!-- data-flow connections -->
  <path class="line" d="M 315 360 H 385"/>
  <path class="line" d="M 285 409 H 350 V 526 H 385"/>
  <path class="line" d="M 695 360 H 790"/>
  <path class="line" d="M 695 525 H 790"/>
  <path class="line" d="M 1165 393 H 1230"/>
  <path class="line" d="M 1510 393 H 1560"/>
  <path class="line" d="M 1645 435 V 485"/>
  <path class="line-warn" d="M 1045 590 V 607 H 1475 V 630"/>

  <!-- trigger cards -->
  <g aria-label="Scheduled trigger">
    <rect class="trigger" x="65" y="167" width="220" height="68" rx="10"/>
    <text class="node-title" x="85" y="192">Schedule</text>
    <text class="mono green" x="85" y="216">17,47 * * * *</text>
  </g>
  <g aria-label="Push trigger">
    <rect class="trigger" x="315" y="167" width="220" height="68" rx="10"/>
    <text class="node-title" x="335" y="192">Relevant push</text>
    <text class="small" x="335" y="216">Baseline main paths</text>
  </g>
  <g aria-label="Manual trigger">
    <rect class="trigger" x="565" y="167" width="220" height="68" rx="10"/>
    <text class="node-title" x="585" y="192">Manual dispatch</text>
    <text class="small" x="585" y="216">Immediate refresh</text>
  </g>
  <rect class="chip" x="815" y="223" width="285" height="29" rx="14"/>
  <text class="chip-text" x="834" y="243">START PAGES WORKFLOW</text>

  <!-- actors and stores -->
  <g aria-label="Builders and agents">
    <rect class="node external" x="65" y="305" width="250" height="115" rx="12"/>
    <text class="node-title" x="90" y="336">Builders + agents</text>
    <text class="body" x="90" y="365">Build and share in sovereign</text>
    <text class="body" x="90" y="387">repositories; review intent only</text>
    <text class="body" x="90" y="409">when direction changes.</text>
  </g>

  <g aria-label="Baseline fleet intent data store">
    <rect class="node store" x="385" y="300" width="310" height="130" rx="12"/>
    <line x1="403" y1="300" x2="403" y2="430" stroke="#79d19b" stroke-width="2"/>
    <line x1="677" y1="300" x2="677" y2="430" stroke="#79d19b" stroke-width="2"/>
    <text class="node-title" x="425" y="332">Baseline intent authority</text>
    <text class="mono green" x="425" y="359">fleet/intent.json</text>
    <text class="body" x="425" y="386">Focus · outcome · done-when</text>
    <text class="body" x="425" y="408">blocker · PD-4 · seams · review date</text>
  </g>

  <g aria-label="GitHub repositories and API">
    <rect class="node external" x="385" y="462" width="310" height="128" rx="12"/>
    <text class="node-title" x="415" y="493">GitHub fleet + API</text>
    <text class="body" x="415" y="520">Six current HEADs and exact-HEAD CI</text>
    <text class="body" x="415" y="544">Contract files at current revisions</text>
    <text class="body" x="415" y="568">Revision comparisons</text>
  </g>

  <g aria-label="Fleet status renderer process">
    <rect class="node process" x="790" y="296" width="375" height="294" rx="14"/>
    <text class="node-title" x="820" y="330">Fleet status renderer</text>
    <text class="mono blue" x="820" y="356">tools/fleet/render_status.py</text>
    <rect class="chip" x="820" y="378" width="315" height="31" rx="8"/>
    <text class="chip-text" x="837" y="399">1  VALIDATE INTENT — FAIL CLOSED</text>
    <rect class="chip" x="820" y="419" width="315" height="31" rx="8"/>
    <text class="chip-text" x="837" y="440">2  COLLECT CURRENT GITHUB FACTS</text>
    <rect class="chip" x="820" y="460" width="315" height="31" rx="8"/>
    <text class="chip-text" x="837" y="481">3  CHECK REVISION + PACKAGE SEAMS</text>
    <rect class="chip" x="820" y="501" width="315" height="31" rx="8"/>
    <text class="chip-text" x="837" y="522">4  REDACT PRIVATE REPOSITORY DATA</text>
    <rect class="chip" x="820" y="542" width="315" height="31" rx="8"/>
    <text class="chip-text" x="837" y="563">5  RENDER ONE STATUS MODEL</text>
  </g>

  <g aria-label="Generated Pages artifact data store">
    <rect class="node artifact" x="1230" y="320" width="280" height="180" rx="12"/>
    <line x1="1248" y1="320" x2="1248" y2="500" stroke="#c09af5" stroke-width="2"/>
    <line x1="1492" y1="320" x2="1492" y2="500" stroke="#c09af5" stroke-width="2"/>
    <text class="node-title" x="1270" y="353">Generated artifact only</text>
    <text class="mono purple" x="1270" y="381">site/status/index.html</text>
    <text class="mono purple" x="1270" y="408">site/status/status.md</text>
    <text class="mono purple" x="1270" y="435">site/status/status.json</text>
    <text class="small" x="1270" y="470">No bot commit · one atomic model</text>
  </g>

  <g aria-label="GitHub Pages">
    <rect class="node process" x="1560" y="342" width="170" height="93" rx="12"/>
    <text class="node-title" x="1587" y="376">GitHub Pages</text>
    <text class="small" x="1587" y="404">Deploy public site</text>
  </g>
  <g aria-label="Users and builders reading the status">
    <rect class="node external" x="1560" y="485" width="170" height="79" rx="12"/>
    <text class="node-title" x="1587" y="517">Users + builders</text>
    <text class="small" x="1587" y="543">Read three tables</text>
  </g>

  <!-- DFD labels -->
  <text class="label" x="323" y="347">direction</text>
  <text class="label" x="325" y="443">commits</text>
  <text class="label" x="716" y="347">reviewed intent</text>
  <text class="label" x="715" y="511">HEAD · CI · seams</text>
  <text class="label" x="1517" y="380">artifact</text>
  <text class="label red" x="1195" y="612">degraded · warning_count · overall</text>

  <!-- Panel 2: jobs -->
  <rect class="panel" x="35" y="650" width="1730" height="300" rx="18"/>
  <text class="section" x="65" y="690">2 · GitHub Actions jobs and task order</text>

  <path class="line" d="M 955 810 H 1025"/>
  <path class="line" d="M 1340 810 H 1425"/>
  <path class="line-warn" d="M 875 915 C 1120 950, 1320 940, 1510 892"/>
  <text class="label" x="969" y="796">artifact</text>
  <text class="label" x="1352" y="796">after deploy</text>
  <text class="label red" x="1080" y="932">only when degraded = true</text>

  <g aria-label="Build job and tasks">
    <rect class="node job" x="65" y="715" width="890" height="205" rx="14"/>
    <text class="node-title" x="95" y="748">BUILD</text>
    <text class="small green" x="174" y="748">always runs after a trigger</text>
    <text class="body" x="95" y="783"><tspan class="green">1</tspan><tspan dx="12">Checkout Baseline</tspan></text>
    <text class="body" x="95" y="814"><tspan class="green">2</tspan><tspan dx="12">Set up Python + configure Pages</tspan></text>
    <text class="body" x="95" y="845"><tspan class="green">3</tspan><tspan dx="12">Verify deterministic corpus</tspan></text>
    <text class="body" x="500" y="783"><tspan class="green">4</tspan><tspan dx="12">Stage quest-picker projection</tspan></text>
    <text class="body" x="500" y="814"><tspan class="green">5</tspan><tspan dx="12">Render live fleet status</tspan></text>
    <text class="body" x="500" y="845"><tspan class="green">6</tspan><tspan dx="12">Upload complete site artifact</tspan></text>
    <rect class="chip" x="95" y="872" width="780" height="30" rx="8"/>
    <text class="chip-text" x="113" y="892">OUTPUTS  degraded · warning_count · overall</text>
  </g>

  <g aria-label="Deploy job">
    <rect class="node job job-deploy" x="1025" y="735" width="315" height="155" rx="14"/>
    <text class="node-title" x="1055" y="770">DEPLOY</text>
    <text class="small blue" x="1055" y="796">needs: build</text>
    <text class="body" x="1055" y="829">Deploy exact Pages artifact</text>
    <text class="body" x="1055" y="853">Expose environment URL</text>
  </g>

  <g aria-label="Audit job">
    <rect class="node job job-audit" x="1425" y="735" width="305" height="155" rx="14"/>
    <text class="node-title" x="1455" y="770">AUDIT</text>
    <text class="small amber" x="1455" y="796">needs: build + deploy</text>
    <text class="body" x="1455" y="829">Page is already public.</text>
    <text class="body" x="1455" y="853">Fail red with safe warning codes.</text>
  </g>

  <!-- Panel 3: loops -->
  <rect class="panel" x="35" y="970" width="1730" height="270" rx="18"/>
  <text class="section" x="65" y="1010">3 · Timers and feedback loops</text>

  <g aria-label="Automatic observation loop">
    <rect class="loop-card" x="65" y="1035" width="520" height="170" rx="14"/>
    <text class="node-title" x="95" y="1070">Observation loop</text>
    <rect class="chip" x="393" y="1050" width="162" height="28" rx="14"/>
    <text class="chip-text" x="411" y="1069">EVERY 30 MIN</text>
    <text class="body" x="95" y="1103">trigger → current facts → three tables → wait</text>
    <path class="line-thin" d="M 122 1140 H 520"/>
    <path class="line-thin" d="M 520 1158 C 520 1190, 122 1190, 122 1155"/>
    <text class="tiny" x="190" y="1179">normal commits need no Baseline echo</text>
  </g>

  <g aria-label="Direction review loop">
    <rect class="loop-card" x="640" y="1035" width="520" height="170" rx="14"/>
    <text class="node-title" x="670" y="1070">Direction-review loop</text>
    <rect class="chip" x="953" y="1050" width="177" height="28" rx="14"/>
    <text class="chip-text" x="971" y="1069">30-DAY REVIEW</text>
    <text class="body" x="670" y="1103">change → review intent → validate → publish</text>
    <path class="line-thin" d="M 697 1140 H 1095"/>
    <path class="line-thin" d="M 1095 1158 C 1095 1190, 697 1190, 697 1155"/>
    <text class="tiny" x="758" y="1179">stale warns; dates never bump mechanically</text>
  </g>

  <g aria-label="Degradation repair loop">
    <rect class="loop-card" x="1215" y="1035" width="515" height="170" rx="14"/>
    <text class="node-title" x="1245" y="1070">Repair loop</text>
    <rect class="warning" x="1522" y="1050" width="178" height="28" rx="14"/>
    <text class="chip-text red" x="1541" y="1069">EVENT DRIVEN</text>
    <text class="body" x="1245" y="1103">publish truth → audit red → fix owner → verify</text>
    <path class="line-warn" d="M 1272 1140 H 1665"/>
    <path class="line-warn" d="M 1665 1158 C 1665 1190, 1272 1190, 1272 1155"/>
    <text class="tiny" x="1338" y="1179">repair the repository that owns the fact</text>
  </g>

  <text class="small" x="65" y="1263">Failure policy: malformed local intent preserves the last valid page; remote degradation publishes UNKNOWN first, then raises a red audit.</text>
</svg>
