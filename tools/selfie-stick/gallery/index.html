<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#0e0e12">
<meta name=robots content="noindex, nofollow">
<title>Era 16 — what people built</title>
<style>
 /* Styling is lifted from the AM4 image gallery so the two read as one product.
    Layout, facet chips, pager and lightbox behave identically; only the meaning
    of a cell changes: a photograph of a structure, not a generated image. */
 :root{--bg:#0e0e12;--panel:#1a1a22;--line:#2b2b36;--fg:#ececf2;--mut:#9a9aa8;--accent:#7aa2ff}
 *{box-sizing:border-box}
 html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
 a{color:inherit}
 header{position:sticky;top:0;z-index:20;background:rgba(14,14,18,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
 .topline{display:flex;align-items:center;gap:10px;padding:9px 12px}
 .topline b{font-size:15px;white-space:nowrap}
 .topline .sub{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
 .filt{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid #3a3a47;color:var(--fg);border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;padding:8px 13px}
 .filt:hover{border-color:#4a4a57}
 .filt .arr{transition:transform .2s;opacity:.65;font-weight:400}
 header.open .filt{background:var(--accent);border-color:var(--accent);color:#0b0b10}
 header.open .filt .arr{transform:rotate(180deg)}
 .fbadge{display:none;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#0b0b10;font-size:11px;font-weight:700;line-height:1}
 header.open .fbadge{background:#0b0b10;color:var(--accent)}
 .panel{display:none;padding:4px 12px 12px;max-height:60vh;overflow:auto}
 header.open .panel{display:block}
 .facet{margin:10px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
 .checks{display:flex;flex-wrap:wrap;gap:6px}
 .ck{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;user-select:none}
 .ck.on{background:var(--accent);border-color:var(--accent);color:#0b0b10;font-weight:600}
 .ck input{display:none}
 .ck .cnt{opacity:.55;font-variant-numeric:tabular-nums}
 .ck.on .cnt{opacity:.8}
 .panel .clr{margin-top:10px;background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
 .sortrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
 main{padding:8px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
 .cell{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#000;cursor:pointer}
 .cell img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
 .cell img.in{opacity:1}
 .cell .badge{position:absolute;left:5px;top:5px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;color:#0b0b10;z-index:2}
 .cell .tt{position:absolute;right:5px;top:5px;font-size:10px;background:rgba(0,0,0,.6);padding:1px 5px;border-radius:5px;color:#cfe;z-index:2}
 .cell .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 7px 6px;font-size:11px;line-height:1.3;color:#fff;
   background:linear-gradient(transparent,rgba(0,0,0,.88));transform:translateY(100%);transition:transform .18s;pointer-events:none}
 .cell:hover .cap{transform:translateY(0)}
 .cell .star{position:absolute;right:5px;bottom:5px;z-index:4;font-size:19px;line-height:1;cursor:pointer;color:#fff;opacity:.8;text-shadow:0 1px 3px #000;display:none}
 .cell .star.on{color:#ffd24a;opacity:1}
 .cell .star i{font-style:normal;font-size:12px;margin-left:2px;vertical-align:2px}
 body.canstar .cell .star{display:block}
 .acts{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
 .act{background:#2a2a35;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer}
 .act:hover{border-color:var(--accent)}
 .hint{font-size:12px;color:var(--mut);line-height:1.5}
 .empty{color:var(--mut);text-align:center;padding:50px 10px;font-size:14px}
 .psize{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
 .psize input{width:56px;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 8px;font-size:13px;text-align:center}
 .pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 10px 6px;font-size:13px;color:var(--mut)}
 .pager button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 15px;font-size:13px;cursor:pointer}
 .pager button:disabled{opacity:.4;cursor:default}
 #lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.95);display:none;flex-direction:column}
 #lb.show{display:flex}
 #lb .x{position:absolute;top:env(safe-area-inset-top);right:0;padding:12px 18px;font-size:24px;color:#fff;cursor:pointer;z-index:3}
 #lb .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
 #lb .stage img{max-width:100%;max-height:100%;object-fit:contain}
 #lb .info{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));max-height:48vh;overflow:auto}
 #lb .pr{font-size:14px;line-height:1.45;color:#fff;margin-bottom:8px}
 #lb .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin-bottom:10px}
 #lb .meta span{background:#2a2a35;padding:2px 8px;border-radius:6px}
 #lbstar{cursor:pointer;background:#2a2a35;padding:2px 8px;border-radius:6px}
 #lbstar.on{background:#ffd24a;color:#0b0b10;font-weight:700}
 #lb .rtitle{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:4px 0 6px}
 #lb .rends{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
 #lb .rends::-webkit-scrollbar{display:none}
 #lb .rend{flex:0 0 auto;width:96px;cursor:pointer}
 #lb .rend .fr{aspect-ratio:1;border-radius:7px;overflow:hidden;background:#000;border:2px solid transparent}
 #lb .rend.cur .fr{border-color:var(--accent)}
 #lb .rend img{width:100%;height:100%;object-fit:cover}
 #lb .rend .lab{font-size:10px;margin-top:3px;text-align:center;color:var(--mut)}
 #lb .nav-a{position:absolute;top:42%;transform:translateY(-50%);font-size:34px;color:rgba(255,255,255,.65);padding:8px 14px;cursor:pointer;user-select:none;z-index:2}
 #lb .pv{left:0}#lb .nx{right:0}
 .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0b0b10;font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
 .toast.show{opacity:1}
</style>
</head>
<body>
<header id=hdr>
 <div class=topline>
  <button class=filt id=expbtn>
   <svg width=14 height=14 viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.5 stroke-linejoin=round><path d="M1.5 3h13l-5 6v4l-3 1.4V9z"/></svg>
   Filters<span class=fbadge id=fbadge></span><span class=arr>▾</span>
  </button>
  <b>Era 16</b>
  <span class=sub id=sub>loading…</span>
  <label class=psize>Page size <input id=psize type=number min=1 value=100></label>
 </div>
 <div class=panel id=panel></div>
</header>

<main id=main><div class=empty>loading…</div></main>

<div id=lb>
 <span class=x onclick="closeLb()">✕</span>
 <span class="nav-a pv" onclick="step(-1)">‹</span>
 <span class="nav-a nx" onclick="step(1)">›</span>
 <div class=stage><img id=lbimg alt=""></div>
 <div class=info>
  <div class=pr id=lbtitle></div>
  <div class=meta id=lbmeta></div>
  <div class=acts id=lbacts></div>
  <div class=rtitle>every light this was shot in</div>
  <div class=rends id=lbrends></div>
 </div>
</div>
<div class=toast id=toast></div>

<script>
// ---- state ----
let DB={images:[]}, MINE=new Set(), VOTES={}, REQS={}, CLAIMS={}, USER='anon', SIGNEDIN=false;
let sel={region:new Set(),kind:new Set(),environment:new Set(),structure:new Set()};
let sort='best', page=0, view=[], cur=-1;   // the auto score is the most useful first impression
const byRun={};                       // run id -> all moods of that one setup

const ENVCOLOR={Clear:'#7aa2ff',Misty:'#9ad5c8',Rain:'#8fb2d9',ThunderStorm:'#b79ae0'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// The structure chip. Valheim gives builds no names, so the builder derives one
// from the place's most distinctive trait ("major hub · 19,720") and a hand-written
// name in cluster-names.json overrides it. Rank and piece count alone identified a
// cluster but said nothing about what it was.
const structOf=r=>r.label||(r.cluster_rank!=null?`#${r.cluster_rank}`:'unmatched');

// Valheim's time of day is a 0..1 fraction of the day, 0.5 being noon. Shown raw
// in a corner it reads as a score out of one, which is the opposite of what it
// means -- 0.90 is a useless midnight frame and 0.64 is the best light there is.
// So render it as a clock.
const clockOf=t=>{
  if(t==null) return '';
  const m=Math.round(t*24*60), h=Math.floor(m/60)%24;
  return `${String(h).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
};

async function boot(){
  try{ DB=await (await fetch('index.json',{cache:'no-store'})).json(); }
  catch(e){ $('main').innerHTML='<div class=empty>could not load index.json</div>'; return; }

  for(const r of DB.images){ (byRun[r.run]=byRun[r.run]||[]).push(r); }

  // On this gallery the star IS the community vote — any logged-in user, not
  // the admin-only print-prep flag the image gallery uses. Guarded: if the bot
  // is down the gallery still renders, just without counts.
  await loadSignals();
  document.body.classList.add('canstar');

  buildPanel(); render();
}

function facetValues(key){
  const f={};
  for(const r of DB.images){
    const v=key==='structure'?structOf(r):r[key];
    if(v==null) continue;
    f[v]=(f[v]||0)+1;
  }
  return Object.entries(f).sort((a,b)=>b[1]-a[1]);
}

function buildPanel(){
  const facets=[['region','Region'],['kind','Kind of place'],['environment','Weather'],
                ['structure','Structure']];
  let h='';
  for(const [key,label] of facets){
    const vals=facetValues(key);
    if(vals.length<2) continue;                    // a one-value facet is not a filter
    h+=`<div class=facet>${label}</div><div class=checks>`;
    for(const [v,n] of vals.slice(0,40)){
      h+=`<label class=ck data-k="${esc(key)}" data-v="${esc(v)}"><input type=checkbox>${esc(v)} <span class=cnt>${n}</span></label>`;
    }
    h+='</div>';
  }
  h+=`<div class=facet>Sort</div><div class="checks sortrow">`;
  for(const [k,l] of [['best','auto scored'],['recent','newest'],['rank','by rank'],['pieces','biggest build'],['height','tallest'],['stars','starred first'],['light','by time of day']])
    h+=`<label class=ck data-sort="${k}"${sort===k?' style="pointer-events:none"':''}>${l}</label>`;
  h+=`</div><button class=clr id=clrbtn>clear filters</button>`;
  $('panel').innerHTML=h;

  $('panel').querySelectorAll('.ck[data-k]').forEach(el=>{
    const k=el.dataset.k,v=el.dataset.v;
    if(sel[k].has(v)) el.classList.add('on');
    el.onclick=e=>{ e.preventDefault(); sel[k].has(v)?sel[k].delete(v):sel[k].add(v);
      el.classList.toggle('on'); page=0; render(); };
  });
  $('panel').querySelectorAll('.ck[data-sort]').forEach(el=>{
    el.classList.toggle('on', el.dataset.sort===sort);
    el.onclick=()=>{ sort=el.dataset.sort; page=0; buildPanel(); render(); };
  });
  $('clrbtn').onclick=()=>{ for(const k in sel) sel[k].clear(); page=0; buildPanel(); render(); };
}

function filtered(){
  return DB.images.filter(r=>
    (!sel.region.size||sel.region.has(r.region)) &&
    (!sel.kind.size||sel.kind.has(r.kind)) &&
    (!sel.environment.size||sel.environment.has(r.environment)) &&
    (!sel.structure.size||sel.structure.has(structOf(r))));
}

function render(){
  view=filtered();
  if(sort==='best') view.sort((a,b)=>(b.aesthetic??-1)-(a.aesthetic??-1));
  else if(sort==='rank') view.sort((a,b)=>(a.cluster_rank||1e9)-(b.cluster_rank||1e9)||(a.variant||'').localeCompare(b.variant||''));
  else if(sort==='pieces') view.sort((a,b)=>(b.pieces||0)-(a.pieces||0));
  else if(sort==='height') view.sort((a,b)=>(b.height_m||0)-(a.height_m||0));
  else if(sort==='light') view.sort((a,b)=>(a.time_of_day||0)-(b.time_of_day||0));
  else if(sort==='stars') view.sort((a,b)=>(STARS.has(b.id)?1:0)-(STARS.has(a.id)?1:0)||b.ts-a.ts);
  else view.sort((a,b)=>b.ts-a.ts);

  const n=Math.max(1,parseInt($('psize').value)||100);
  const pages=Math.max(1,Math.ceil(view.length/n));
  page=Math.min(page,pages-1);
  const slice=view.slice(page*n,page*n+n);

  const active=Object.values(sel).reduce((a,s)=>a+s.size,0);
  $('fbadge').style.display=active?'inline-flex':'none';
  $('fbadge').textContent=active;
  $('sub').textContent=`${view.length} of ${DB.n} photographs · ${DB.runs} setups`;

  $('main').innerHTML = slice.length
    ? `<div class=grid>${slice.map(cellHtml).join('')}</div>` +
      `<div class=pager><button id=pp ${page?'':'disabled'}>‹ prev</button>` +
      `<span>${page+1} / ${pages}</span>` +
      `<button id=pn ${page<pages-1?'':'disabled'}>next ›</button></div>`
    : '<div class=empty>nothing matches those filters</div>';

  $('main').querySelectorAll('.cell').forEach(el=>{
    const i=+el.dataset.i;
    el.onclick=ev=>{ if(ev.target.classList.contains('star')) return; openLb(page*n+i); };
    const st=el.querySelector('.star');
    if(st) st.onclick=ev=>{ ev.stopPropagation(); toggleStar(slice[i].id); };
    const img=el.querySelector('img');
    img.onload=()=>img.classList.add('in');
  });
  if($('pp')) $('pp').onclick=()=>{page--;render();window.scrollTo(0,0);};
  if($('pn')) $('pn').onclick=()=>{page++;render();window.scrollTo(0,0);};
}

function cellHtml(r,i){
  const col=ENVCOLOR[r.environment]||'#8a8a99';
  const cap = r.pieces
    ? `${r.pieces.toLocaleString()} pieces · ${Math.round(r.height_m)} m tall` +
      (r.builders>1?` · ${r.builders} builders`:'')
    : 'unmatched shot';
  return `<div class=cell data-i="${i}">
    <img loading=lazy src="thumb/${esc(r.id)}.webp" alt="">
    <span class=badge style="background:${col}">${esc(r.environment||'')}</span>
    <span class=tt title="${r.aesthetic!=null?'aesthetic score for this photograph':'structure ranking score'}">${r.aesthetic!=null?r.aesthetic.toFixed(2):(r.score!=null?r.score.toFixed(1):'')}</span>
    <span class="star${MINE.has(r.id)?' on':''}">${MINE.has(r.id)?'★':'☆'}${VOTES[r.id]?`<i>${VOTES[r.id]}</i>`:''}</span>
    <div class=cap>${esc(cap)}</div></div>`;
}

// ---- lightbox ----
function openLb(i){
  cur=i; const r=view[i]; if(!r) return;
  // 1600px render, falling back to the thumbnail only if it is missing. Opening a
  // picture and getting the same thumbnail back is the whole point of a lightbox
  // failing.
  $('lbimg').src='large/'+r.id+'.webp';
  $('lbimg').onerror=()=>{ $('lbimg').onerror=null; $('lbimg').src='thumb/'+r.id+'.webp'; };
  $('lbtitle').textContent = r.pieces
    ? `${r.pieces.toLocaleString()} pieces, ${Math.round(r.height_m)} m tall`
    : 'unmatched shot';
  const bits=[];
  if(r.cluster_rank) bits.push('rank #'+r.cluster_rank);
  if(r.region) bits.push(r.region);
  if(r.portals) bits.push(`${r.portals} portals`);
  if(r.beds) bits.push(`${r.beds} beds`);
  if(r.signs) bits.push(`${r.signs} signs`);
  if(r.builders) bits.push(`${r.builders} builders`);
  if(r.environment) bits.push(r.environment);
  if(r.aesthetic!=null) bits.push('aesthetic '+r.aesthetic.toFixed(2));
  if(r.score!=null) bits.push('structure score '+r.score.toFixed(2));
  if(r.time_of_day!=null) bits.push(clockOf(r.time_of_day)+' in-game');
  if(r.shot_distance_m!=null) bits.push(`shot from ${Math.round(r.shot_distance_m)} m`);
  const nv=VOTES[r.id]||0;
  $('lbmeta').innerHTML=bits.map(b=>`<span>${esc(b)}</span>`).join('')+
    `<span id=lbstar class="${MINE.has(r.id)?'on':''}">${MINE.has(r.id)?'★ voted':'☆ vote'}${nv?' · '+nv:''}</span>`;
  $('lbstar').onclick=()=>toggleStar(r.id,true);

  // structure-level actions
  const nreq=REQS[r.cluster_id]||0, claimed=CLAIMS[r.cluster_id];
  $('lbacts').innerHTML = r.cluster_id==null ? '' : (SIGNEDIN
    ? `<button class=act id=actreq>📷 more shots of this${nreq?` · ${nreq}`:''}</button>
       <button class=act id=actmine>🏠 ${claimed?`claimed by ${esc(claimed)}`:'this one is mine'}</button>
       <button class=act id=actnot>not mine</button>`
    : `<span class=hint>${nreq?`${nreq} request(s) for this build · `:''}${claimed?`claimed by ${esc(claimed)} · `:''}sign in to ask for more shots or claim this build</span>`);
  if($('actreq')) $('actreq').onclick=()=>sendSignal('request',r,{note:''});
  if($('actmine')) $('actmine').onclick=()=>sendSignal('claim',r,{mine:true});
  if($('actnot')) $('actnot').onclick=()=>sendSignal('claim',r,{mine:false});

  const sibs=byRun[r.run]||[];
  $('lbrends').innerHTML=sibs.map(s=>`<div class="rend${s.id===r.id?' cur':''}" data-id="${esc(s.id)}">
     <div class=fr><img loading=lazy src="thumb/${esc(s.id)}.webp" alt=""></div>
     <div class=lab>${esc(clockOf(s.time_of_day)||(s.variant||'').replace(/^[a-d]_/,''))}</div></div>`).join('');
  $('lbrends').querySelectorAll('.rend').forEach(el=>{
    el.onclick=()=>{ const j=view.findIndex(v=>v.id===el.dataset.id); if(j>=0) openLb(j); };
  });
  $('lb').classList.add('show');
}
function closeLb(){ $('lb').classList.remove('show'); }
function step(d){ const j=cur+d; if(j>=0&&j<view.length) openLb(j); }

// Signed-out visitors all arrive as "anon", and the server's one-vote-per-user
// index would make them collide — first vote wins, everyone else silently
// ignored. So each browser keeps its own random id. Not a security boundary:
// clearing storage gets you another vote. It only separates honest visitors.
const VOTER=(()=>{
  try{
    let v=localStorage.getItem('valheim_voter');
    if(!v){ v=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2))
              .replace(/-/g,'').slice(0,32);
            localStorage.setItem('valheim_voter',v); }
    return v;
  }catch(e){ return ''; }   // private mode: vote still counts, just not remembered
})();

async function loadSignals(){
  try{
    const s=await fetch('/api/valheim/signals?voter='+encodeURIComponent(VOTER),
                        {cache:'no-store'}).then(r=>r.json());
    VOTES=s.votes||{}; REQS=s.requests||{}; CLAIMS=s.claims||{};
    MINE=new Set(s.mine||[]); USER=s.user||'anon';
    SIGNEDIN=!!USER && USER.indexOf('anon')!==0;
  }catch(e){ /* bot down — page still works, just no counts */ }
}

async function toggleStar(id,fromLb){
  const on=!MINE.has(id);
  on?MINE.add(id):MINE.delete(id);
  VOTES[id]=Math.max(0,(VOTES[id]||0)+(on?1:-1));
  render(); if(fromLb) openLb(cur);
  try{
    const r=await fetch('/api/valheim/vote',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({image_id:id,on,voter:VOTER})});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    VOTES[id]=j.votes;                            // server count wins
    render(); if(fromLb) openLb(cur);
  }catch(e){
    on?MINE.delete(id):MINE.add(id);              // put it back; the server is the truth
    VOTES[id]=Math.max(0,(VOTES[id]||0)+(on?-1:1));
    render(); toast('could not save that vote');
  }
}

// Requests and claims act on the structure, not the frame, so they live in the
// lightbox where the structure is named.
async function sendSignal(kind,r,body){
  try{
    const res=await fetch('/api/valheim/'+kind,{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify(Object.assign({cluster_id:r.cluster_id,
        label:`#${r.cluster_rank} · ${(r.pieces||0).toLocaleString()} pieces`},body))});
    const j=await res.json();
    if(!res.ok) throw new Error(j.error||res.status);
    await loadSignals(); render(); openLb(cur);
    toast(kind==='request'?'asked for more shots':'thanks — noted');
  }catch(e){ toast(String(e.message||e)); }
}
let tt;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }

$('expbtn').onclick=()=>$('hdr').classList.toggle('open');
$('psize').oninput=()=>{page=0;render();};
document.addEventListener('keydown',e=>{
  if(!$('lb').classList.contains('show')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft') step(-1);
  if(e.key==='ArrowRight') step(1);
});
boot();
</script>
</body>
