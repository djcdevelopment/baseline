# CreatorOS Constellation Manifest
#
# Comfy Valheim creator suite, spatial narrative tools, and client modding platform.
# Hub and discovery index rooted at baseline.

schema_version: 1

archetype: engineering-only
topology: centered
conformance: canonical

intent: "Comfy Valheim creator suite, spatial narrative tools, and client modding platform"

constellation:
  name: creator-os
  description: "Comfy Valheim creator suite, spatial narrative tools, and client modding platform"
  root_path: C:\work\baseline
  pm_workspace: docs/

identity:
  github_org: djcdevelopment

repos:
  - name: baseline
    kind: git
    role: "Hub of knowledge, evidence, decision records, and discovery index for the Comfy fleet"
    producer_type: dev_tooling
    github: djcdevelopment/baseline
    visibility: private
    local_path: C:\work\baseline
    primary: true
    lifecycle: active
    surfaces:
      - name: public-workbench
        kind: web-app
        deployment_url: "https://am4.tail8e749c.ts.net/workbench"
        lifecycle: active

  - name: comfy-quest
    kind: git
    role: "Core Quest Lab, Runtime, Contracts, Studio, and in-game creator tooling"
    producer_type: engine
    github: djcdevelopment/comfy-quest
    visibility: private
    local_path: C:\work\comfy-quest
    primary: false
    depends_on:
      - baseline
      - isolate
    lifecycle: active
    surfaces:
      - name: quest-studio
        kind: cli
        lifecycle: active

  - name: dmos
    kind: git
    role: "Dungeon Master OS narrative orchestration, world state engine, and chronicle generator"
    producer_type: engine
    github: djcdevelopment/DMos
    visibility: private
    local_path: E:\omen\DMos
    primary: false
    depends_on:
      - comfy-quest
      - SelfieStick
    lifecycle: active

  - name: ComfyStewardView
    kind: git
    role: "Spatial viewer, multi-perspective steward camera rig, and world snapshot analytics"
    producer_type: operational_viewer
    github: djcdevelopment/ComfyStewardView
    visibility: private
    local_path: C:\work\ComfyStewardView
    primary: false
    depends_on:
      - baseline
      - SelfieStick
    lifecycle: active
    surfaces:
      - name: steward-gallery
        kind: web-app
        lifecycle: active

  - name: SelfieStick
    kind: git
    role: "Automated 4K photographic camera engine for Valheim archives and chronicles (FX99)"
    producer_type: engine
    github: djcdevelopment/SelfieStick
    visibility: private
    local_path: C:\work\SelfieStick
    primary: false
    depends_on:
      - baseline
    lifecycle: active
    surfaces:
      - name: camera-runner
        kind: cli
        lifecycle: active

  - name: Unfaded
    kind: git
    role: "Zero death blackout, 360-degree spectator drone scouting, and tactical camera mod on Thunderstore"
    producer_type: engine
    github: djcdevelopment/Unfaded
    visibility: private
    local_path: C:\work\Unfaded
    primary: false
    depends_on:
      - baseline
