name: Pages

# Publishes site/ and nothing else. The rest of the repo — docs/, handoffs/,
# fieldlab/ — stays off the web even though it is readable on GitHub.
on:
  push:
    branches: [main]
    # data/processed pages are staged into the artifact below, so they must
    # trigger a redeploy too
    paths: ['site/**', 'data/processed/quest-picker.html',
            'data/processed/provenance*.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# main takes direct pushes from background automation, so let a newer run win
# rather than queue behind one that is already stale.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage quest picker for deployment
        run: |
          mkdir -p site/questpicker
          cp data/processed/quest-picker.html site/questpicker/index.html
          cp data/processed/quest-picker.html site/questpicker/quest-picker.html
          cp data/processed/provenance*.html site/questpicker/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
