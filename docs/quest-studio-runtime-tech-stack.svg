<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Quest Studio Runtime technology stack</title><desc id="desc">Layered view of browser, Companion, shared contracts, BepInEx mods, Valheim integration, files, tests, and deployment hosts.</desc>
